<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d"><title>POS · La Bandeja + Beer Station</title><link rel="stylesheet" href="/pos.css"></head>
<body>
<section id="posApp">
<header><div><small id="posKicker">POS · PEDIDOS EN VIVO</small><strong id="posTitle">La Bandeja</strong></div><div class="station-pill" id="stationPill">LB</div><span class="pos-online">OPERATIVO</span></header>
<main>
<section class="catalog"><div class="bar"><select id="placeSelect"></select><input id="search" placeholder="Buscar producto"><button id="refresh">Actualizar</button></div><nav id="cats"></nav><div id="productGrid" class="product-grid"></div></section>
<aside class="ticket"><div class="ticket-head"><small>PEDIDO MANUAL</small><h2 id="ticketPlace">Nuevo pedido</h2></div><input id="customerName" placeholder="Cliente / referencia"><div id="ticketItems"></div><div class="payment"><select id="paymentMethod"><option value="CASH">Efectivo</option><option value="CARD">Tarjeta</option><option value="TRANSFER">Transferencia</option><option value="CREDIT">Crédito</option></select><select id="paymentStatus"><option value="PENDING">Pendiente</option><option value="PAID">Pagado</option><option value="CREDIT">Crédito</option></select></div><div class="total"><span>Total</span><b id="ticketTotal">L 0.00</b></div><button id="sendSale" class="send">Enviar pedido</button></aside>
</main>
<section class="orders-panel"><div class="orders-head"><div><small>ÓRDENES ENTRANTES</small><h2 id="ordersTitle">Pedidos La Bandeja</h2></div><span class="live-badge">EN VIVO</span></div><div id="orders"></div></section>
</section>
<dialog id="optionDialog"><button class="close" data-close>×</button><div class="option-card"><small>PERSONALIZAR</small><h2 id="optName"></h2><div id="optGroups"></div><button id="optAdd" class="send">Agregar</button></div></dialog>
<div id="toast"></div><script src="/supabase.js"></script><script type="module" src="/pos.js"></script></body></html>
