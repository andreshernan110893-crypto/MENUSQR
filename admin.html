 <div class="auth-card"><span>ADMINISTRACIÓN</span><h1>La Bandeja + Beer Station</h1><p>Gestiona todo el ecosistema desde un solo lugar.</p>
 <input id="authEmail" type="email" value="andreshernandez170393@gmail.com" placeholder="Correo administrador"><input id="authPassword" type="password" placeholder="Contraseña">
