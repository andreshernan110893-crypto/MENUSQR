name: Deploy Distrito 504 to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_ZPJUqlCMZNyQhSeYQnGiefVn
      VERCEL_PROJECT_ID: prj_HA3g3cJcpMUxzseWLt1y6KXandNX

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy source directly to production
        id: deploy
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | tail -n 1)
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment: $DEPLOYMENT_URL"

      - name: Assign permanent production alias
        run: vercel alias set "${{ steps.deploy.outputs.deployment_url }}" distrito-504-pos.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
