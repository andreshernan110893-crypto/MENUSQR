name: Deploy MENUSQR Clean

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Ensure clean Vercel project exists
        shell: bash
        run: |
          if vercel project inspect menusqr-clean --scope andreshernan110893-2059s-projects --token=${{ secrets.VERCEL_TOKEN }} >/dev/null 2>&1; then
            echo "menusqr-clean already exists"
          else
            vercel project add menusqr-clean --scope andreshernan110893-2059s-projects --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy clean project to production
        id: deploy
        shell: bash
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --yes --project menusqr-clean --scope andreshernan110893-2059s-projects --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null | tail -n 1)
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment: $DEPLOYMENT_URL"
