<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAKEN · Control Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=20261005-black-v13">
</head>
<body class="kraken-wow">
<section id="adminView" class="wow-app">
  <aside class="wow-sidebar">
    <div class="wow-brand wow-brand-image">
      <img src="/assets/new/hydra-brand.webp" alt="HYDRA">
      <small class="brand-system">KRAKEN · SISTEMA DE GESTIÓN</small>
    </div>

    <nav id="tabs" class="wow-nav">
      <button class="nav-item active" data-tab="dashboard"><span class="nav-symbol">⌂</span><span>Dashboard</span></button>
      <button class="nav-item" data-tab="sales"><span class="nav-symbol">◒</span><span>Ventas</span></button>
      <div class="nav-group" data-group="purchases">
        <button class="nav-group-head" data-group-toggle="purchases"><span class="nav-symbol">▱</span><span>Compras</span><i>›</i></button>
        <div class="nav-submenu">
          <button data-nav-tab="purchases" data-purchase-view="normal">Compra normal</button>
          <button data-nav-tab="purchases" data-purchase-view="products">Con productos</button>
        </div>
      </div>
      <button class="nav-item" data-tab="expenses"><span class="nav-symbol">▤</span><span>Gastos</span></button>
      <button class="nav-item" data-tab="inventory"><span class="nav-symbol">◇</span><span>Inventario</span></button>
      <div class="nav-group" data-group="production">
        <button class="nav-group-head" data-group-toggle="production"><span class="nav-symbol">▥</span><span>Producción</span><i>›</i></button>
        <div class="nav-submenu">
          <button data-nav-tab="production" data-prod-view="overview">Resumen</button>
          <button data-nav-tab="production" data-prod-view="ingredients">Insumos</button>
          <button data-nav-tab="production" data-prod-view="presentations">Presentaciones</button>
          <button data-nav-tab="production" data-prod-view="recipes">Recetas</button>
          <button data-nav-tab="production" data-prod-view="batches">Producción</button>
          <button data-nav-tab="production" data-prod-view="waste">Mermas</button>
          <button data-nav-tab="production" data-prod-view="costs">Variación de costos</button>
        </div>
      </div>
      <button class="nav-item" data-tab="receivables"><span class="nav-symbol">⇄</span><span>CxC</span></button>
      <button class="nav-item" data-tab="payables"><span class="nav-symbol">⇆</span><span>CxP</span></button>
      <button class="nav-item" data-tab="employees"><span class="nav-symbol">◎</span><span>Empleados</span></button>
      <div class="nav-group" data-group="catalog">
        <button class="nav-group-head" data-group-toggle="catalog"><span class="nav-symbol">▦</span><span>Catálogo</span><i>›</i></button>
        <div class="nav-submenu">
          <button data-nav-tab="catalog" data-catalog-view="products">Productos</button>
          <button data-nav-tab="catalog" data-catalog-view="customers">Clientes</button>
          <button data-nav-tab="catalog" data-catalog-view="suppliers">Proveedores</button>
          <button data-nav-tab="catalog" data-catalog-view="categories">Categorías</button>
        </div>
      </div>
      <button class="nav-item" data-tab="reports"><span class="nav-symbol">▥</span><span>Reportes</span></button>
      <div class="nav-group" data-group="config">
        <button class="nav-group-head" data-group-toggle="config"><span class="nav-symbol">⚙</span><span>Configuración</span><i>›</i></button>
        <div class="nav-submenu">
          <button data-nav-tab="combos">Combos</button><button data-nav-tab="banners">Banners</button><button data-nav-tab="promotions">Promociones</button>
          <button data-nav-tab="extras">Extras</button><button data-nav-tab="branding">Marcas</button><button data-nav-tab="places">Ubicaciones</button>
          <button data-nav-tab="orders">Pedidos</button><button data-nav-tab="feedback">Feedback</button>
        </div>
      </div>
    </nav>

    <div class="wow-sidefoot"><span></span><div><b>Sistema operativo</b><small>Conectado</small></div></div>
  </aside>

  <section class="wow-workspace">
    <header class="wow-topbar">
      <button id="mobileMenu" class="mobile-menu">☰</button>
      <div class="wow-search">
        <button id="globalSearchBtn" type="button">⌕</button><span>Buscar en el sistema...</span><kbd>Ctrl + K</kbd>
      </div>
      <div class="wow-user"><div class="user-orb">AH</div><div><b>Andres Hernandez</b><small>Administrador</small></div><span>⌄</span></div>
      <div id="toolbarActions" class="wow-actions"></div>
    </header>

    <main class="wow-main">
      <div class="wow-page-head">
        <div><small id="sectionEyebrow">OPERACIÓN</small><h1 id="sectionTitle">Dashboard Ejecutivo</h1></div>
      </div>
      <section id="content"></section>
    </main>
  </section>
</section>

<div id="searchPalette" class="search-palette" hidden>
  <div class="search-box">
    <input id="globalSearchInput" placeholder="Buscar módulo, producto, cliente..." autocomplete="off">
    <button id="closeSearch" type="button">Esc</button>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<dialog id="editDialog"><button class="close" data-close>&times;</button><form id="editForm" class="form-card"></form></dialog>
<div id="toast"></div>
<script src="/supabase.js"></script>
<script type="module" src="/admin.js?v=20261005-black-v13"></script>
</body>
</html>
