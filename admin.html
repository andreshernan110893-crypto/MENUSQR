<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRAKEN · Operations Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css?v=20261005-command-v1">
</head>
<body class="command-ui">
<section id="adminView" class="command-app">
  <header class="command-header">
    <div class="command-brand">
      <div class="command-logo">K</div>
      <div>
        <strong>KRAKEN</strong>
        <small>Operations Center</small>
      </div>
    </div>

    <div class="command-location">
      <span class="live-dot"></span>
      <b>La Bandeja</b>
      <span class="location-divider">/</span>
      <b>Beer Station</b>
    </div>

    <div class="command-tools">
      <button id="globalSearchBtn" type="button" class="icon-action" title="Buscar">⌕</button>
      <div id="toolbarActions" class="topbar-actions"></div>
      <button id="mobileMenu" class="icon-action mobile-only" type="button">☰</button>
    </div>
  </header>

  <nav id="tabs" class="command-nav">
    <button class="nav-item active" data-tab="dashboard"><span>Dashboard</span></button>
    <button class="nav-item" data-tab="sales"><span>Ventas</span></button>

    <div class="nav-group" data-group="purchases">
      <button class="nav-group-head" data-group-toggle="purchases"><span>Compras</span><i>⌄</i></button>
      <div class="nav-submenu">
        <button data-nav-tab="purchases" data-purchase-view="normal">Compra normal</button>
        <button data-nav-tab="purchases" data-purchase-view="products">Con productos</button>
      </div>
    </div>

    <button class="nav-item" data-tab="expenses"><span>Gastos</span></button>
    <button class="nav-item" data-tab="inventory"><span>Inventario</span></button>

    <div class="nav-group" data-group="production">
      <button class="nav-group-head" data-group-toggle="production"><span>Producción</span><i>⌄</i></button>
      <div class="nav-submenu">
        <button data-nav-tab="production" data-prod-view="overview">Resumen</button>
        <button data-nav-tab="production" data-prod-view="ingredients">Insumos</button>
        <button data-nav-tab="production" data-prod-view="presentations">Presentaciones</button>
        <button data-nav-tab="production" data-prod-view="recipes">Recetas</button>
        <button data-nav-tab="production" data-prod-view="batches">Producción</button>
        <button data-nav-tab="production" data-prod-view="waste">Mermas</button>
        <button data-nav-tab="production" data-prod-view="costs">Variación de costos</button>
      </div>
    </div>

    <button class="nav-item" data-tab="receivables"><span>CxC</span></button>
    <button class="nav-item" data-tab="payables"><span>CxP</span></button>
    <button class="nav-item" data-tab="employees"><span>Empleados</span></button>

    <div class="nav-group" data-group="catalog">
      <button class="nav-group-head" data-group-toggle="catalog"><span>Catálogo</span><i>⌄</i></button>
      <div class="nav-submenu">
        <button data-nav-tab="catalog" data-catalog-view="products">Productos</button>
        <button data-nav-tab="catalog" data-catalog-view="customers">Clientes</button>
        <button data-nav-tab="catalog" data-catalog-view="suppliers">Proveedores</button>
        <button data-nav-tab="catalog" data-catalog-view="categories">Categorías</button>
      </div>
    </div>

    <button class="nav-item" data-tab="reports"><span>Reportes</span></button>

    <div class="nav-group" data-group="config">
      <button class="nav-group-head" data-group-toggle="config"><span>Config</span><i>⌄</i></button>
      <div class="nav-submenu submenu-right">
        <button data-nav-tab="combos">Combos</button>
        <button data-nav-tab="banners">Banners</button>
        <button data-nav-tab="promotions">Promociones</button>
        <button data-nav-tab="extras">Extras y opciones</button>
        <button data-nav-tab="branding">Logos y marcas</button>
        <button data-nav-tab="places">Ubicaciones</button>
        <button data-nav-tab="orders">Pedidos operativos</button>
        <button data-nav-tab="feedback">Feedback</button>
      </div>
    </div>
  </nav>

  <main class="command-main">
    <div class="command-page-head">
      <div>
        <small id="sectionEyebrow">GERENCIA</small>
        <h1 id="sectionTitle">Dashboard Ejecutivo</h1>
      </div>
      <div class="page-status">
        <span class="live-dot"></span>
        <span>Operación en vivo</span>
      </div>
    </div>
    <section id="content"></section>
  </main>
</section>

<div id="searchPalette" class="search-palette" hidden>
  <div class="search-box">
    <input id="globalSearchInput" placeholder="Buscar módulo, producto, cliente..." autocomplete="off">
    <button id="closeSearch" type="button">Esc</button>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<dialog id="editDialog"><button class="close" data-close>&times;</button><form id="editForm" class="form-card"></form></dialog>
<div id="toast"></div>
<script src="/supabase.js"></script>
<script type="module" src="/admin.js?v=20261005-command-v1"></script>
</body>
</html>
